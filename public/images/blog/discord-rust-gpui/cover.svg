    />
  </defs>

  <rect width="1200" height="630" fill="url(#discord-rust-gpui-sky)" />
  <rect width="1200" height="630" fill="url(#discord-rust-gpui-bloom)" />

  <g mask="url(#discord-rust-gpui-depth-mask)">
    <rect width="1200" height="630" fill="url(#discord-rust-gpui-dots)" opacity="0.16" filter="url(#discord-rust-gpui-soft)" />
  </g>

  <rect width="1200" height="630" fill="url(#discord-rust-gpui-old-halo)" />

  <g opacity="0.5" filter="url(#discord-rust-gpui-defocus)">
    <rect x="230" y="215" width="200" height="200" rx="52" fill="url(#discord-rust-gpui-old-fill)" />
    <use href="#discord-rust-gpui-clyde" fill="#ffffff" transform="translate(271 256) scale(4.9)" />
  </g>

  <g filter="url(#discord-rust-gpui-arrow-glow)" fill="none" stroke="url(#discord-rust-gpui-arrow)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M478 315 H598" />
    <path d="M566 283 L600 315 L566 347" stroke="#7cc0ff" />
  </g>

  <circle cx="760" cy="330" r="230" fill="url(#discord-rust-gpui-ember)" />

  <g filter="url(#discord-rust-gpui-glow)">
    <rect x="650" y="205" width="220" height="220" rx="58" fill="url(#discord-rust-gpui-new-fill)" />
  </g>

  <g clip-path="url(#discord-rust-gpui-new-clip)" fill="none" stroke="#eba184" stroke-width="1.5">
    <path d="M723.3 205 V425 M796.7 205 V425 M650 278.3 H870 M650 351.7 H870" />
    <path d="M650 205 L870 425 M870 205 L650 425" />
    <circle cx="760" cy="315" r="86" />
    <rect x="677" y="232" width="166" height="166" rx="40" />
  </g>

  <rect x="650.75" y="205.75" width="218.5" height="218.5" rx="57.25" fill="none" stroke="url(#discord-rust-gpui-new-rim)" stroke-width="1.5" />

  <use href="#discord-rust-gpui-clyde" fill="#fbf0e8" filter="url(#discord-rust-gpui-mark-shadow)" transform="translate(694 249) scale(5.5)" />
