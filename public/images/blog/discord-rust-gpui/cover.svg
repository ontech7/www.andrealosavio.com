<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <radialGradient id="discord-rust-gpui-sky" gradientUnits="userSpaceOnUse" cx="760" cy="315" r="760">
      <stop offset="0%" stop-color="#08203f" />
      <stop offset="45%" stop-color="#050912" />
      <stop offset="100%" stop-color="#03060c" />
    </radialGradient>

    <radialGradient id="discord-rust-gpui-bloom" gradientUnits="userSpaceOnUse" cx="760" cy="315" r="360">
      <stop offset="0%" stop-color="#0d7ef2" stop-opacity="0.34" />
      <stop offset="45%" stop-color="#0d7ef2" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0d7ef2" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="discord-rust-gpui-ember" gradientUnits="userSpaceOnUse" cx="760" cy="330" r="230">
      <stop offset="0%" stop-color="#f08a5d" stop-opacity="0.42" />
      <stop offset="55%" stop-color="#d9673f" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#d9673f" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="discord-rust-gpui-old-halo" gradientUnits="userSpaceOnUse" cx="330" cy="315" r="200">
      <stop offset="0%" stop-color="#5865f2" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#5865f2" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="discord-rust-gpui-old-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e98f7" />
      <stop offset="100%" stop-color="#5865f2" />
    </linearGradient>

    <linearGradient id="discord-rust-gpui-new-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eba183" />
      <stop offset="55%" stop-color="#d9714b" />
      <stop offset="100%" stop-color="#c4552f" />
    </linearGradient>

    <linearGradient id="discord-rust-gpui-new-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe2d2" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ffb08c" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="discord-rust-gpui-arrow" gradientUnits="userSpaceOnUse" x1="478" y1="315" x2="600" y2="315">
      <stop offset="0%" stop-color="#0d7ef2" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7cc0ff" />
    </linearGradient>

    <pattern id="discord-rust-gpui-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.3" fill="#7cc0ff" />
    </pattern>

    <radialGradient id="discord-rust-gpui-depth" gradientUnits="userSpaceOnUse" cx="700" cy="315" r="560">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <mask id="discord-rust-gpui-depth-mask">
      <rect width="1200" height="630" fill="url(#discord-rust-gpui-depth)" />
    </mask>

    <clipPath id="discord-rust-gpui-new-clip">
      <rect x="650" y="205" width="220" height="220" rx="58" />
    </clipPath>

    <filter id="discord-rust-gpui-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>

    <filter id="discord-rust-gpui-defocus" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" />
    </filter>

    <filter id="discord-rust-gpui-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="26" result="blurred" />
      <feFlood flood-color="#f08a5d" flood-opacity="0.55" />
      <feComposite in2="blurred" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="discord-rust-gpui-arrow-glow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blurred" />
      <feMerge>
        <feMergeNode in="blurred" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="discord-rust-gpui-mark-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7a2a10" flood-opacity="0.45" />
    </filter>

