<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <radialGradient id="archify-architecture-diagram-sky" cx="50%" cy="49%" r="78%">
      <stop offset="0%" stop-color="#062a45" />
      <stop offset="46%" stop-color="#050912" />
      <stop offset="100%" stop-color="#03060c" />
    </radialGradient>

    <linearGradient id="archify-architecture-diagram-hex" x1="0%" y1="0%" x2="78%" y2="100%">
      <stop offset="0%" stop-color="#8ad8fb" />
      <stop offset="52%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#12587f" />
    </linearGradient>

    <linearGradient id="archify-architecture-diagram-plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1526" />
      <stop offset="100%" stop-color="#060a14" />
    </linearGradient>

    <radialGradient id="archify-architecture-diagram-falloff" cx="50%" cy="49%" r="52%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="58%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <mask id="archify-architecture-diagram-depth">
      <rect width="1200" height="630" fill="url(#archify-architecture-diagram-falloff)" />
    </mask>

    <filter id="archify-architecture-diagram-bloom" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="30" />
    </filter>

    <filter id="archify-architecture-diagram-haze" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>

    <filter id="archify-architecture-diagram-wireglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" />
    </filter>

    <filter id="archify-architecture-diagram-seat" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#03060c" flood-opacity="0.75" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#archify-architecture-diagram-sky)" />

  <g mask="url(#archify-architecture-diagram-depth)">
    <g filter="url(#archify-architecture-diagram-haze)" opacity="0.16" stroke="#12587f" stroke-width="1.5">
      <path d="M0 90 H1200 M0 190 H1200 M0 290 H1200 M0 390 H1200 M0 490 H1200 M0 590 H1200" />
      <path d="M100 0 V630 M250 0 V630 M400 0 V630 M550 0 V630 M700 0 V630 M850 0 V630 M1000 0 V630 M1150 0 V630" />
    </g>

    <g filter="url(#archify-architecture-diagram-haze)" opacity="0.38">
      <rect x="96" y="212" width="300" height="206" rx="18" fill="url(#archify-architecture-diagram-plate)" stroke="#12587f" stroke-width="1.5" />
      <g fill="#12587f">
        <rect x="128" y="248" width="176" height="13" rx="6.5" />
        <rect x="148" y="284" width="216" height="13" rx="6.5" />
        <rect x="148" y="320" width="150" height="13" rx="6.5" />
        <rect x="128" y="356" width="196" height="13" rx="6.5" />
      </g>
    </g>

    <g fill="none" stroke="#0ea5e9" stroke-width="2.5" opacity="0.5">
      <path d="M396 288 H432" />
      <path d="M396 315 H432" />
      <path d="M396 342 H432" />
    </g>

    <g fill="none" stroke="#0ea5e9" stroke-width="9" opacity="0.24" filter="url(#archify-architecture-diagram-wireglow)">
      <path d="M756 268 H832 V196 H908" />
      <path d="M756 315 H944" />
      <path d="M756 362 H832 V434 H908" />
    </g>
    <g fill="none" stroke="#0ea5e9" stroke-width="2.5" opacity="0.55" stroke-linecap="round" stroke-linejoin="round">
      <path d="M756 268 H832 V196 H908" />
      <path d="M756 315 H944" />
      <path d="M756 362 H832 V434 H908" />
    </g>

    <g fill="url(#archify-architecture-diagram-plate)" stroke="#12587f" stroke-width="1.5" opacity="0.62">
      <rect x="908" y="174" width="122" height="44" rx="14" />
      <rect x="944" y="293" width="122" height="44" rx="14" />
      <rect x="908" y="412" width="122" height="44" rx="14" />
    </g>
    <g fill="#0ea5e9" opacity="0.4">
      <circle cx="932" cy="196" r="5" />
      <circle cx="968" cy="315" r="5" />
      <circle cx="932" cy="434" r="5" />
    </g>
  </g>

  <g opacity="0.5" filter="url(#archify-architecture-diagram-bloom)">
    <polygon points="600,160 750,235 750,385 600,460 450,385 450,235" fill="#0ea5e9" />
  </g>

  <polygon
    points="600,160 750,235 750,385 600,460 450,385 450,235"
    fill="url(#archify-architecture-diagram-hex)"
    stroke="url(#archify-architecture-diagram-hex)"
    stroke-width="24"
    stroke-linejoin="round"
  />
  <polygon
    points="600,206 708,260 708,360 600,414 492,360 492,260"
    fill="url(#archify-architecture-diagram-plate)"
    stroke="#8ad8fb"
    stroke-width="2"
    stroke-linejoin="round"
    stroke-opacity="0.35"
  />

  <g
    fill="none"
    stroke="#ffffff"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#archify-architecture-diagram-seat)"
  >
    <path d="M492 260 L600 314 L708 260" />
    <path d="M544 286 V325" />
    <path d="M656 286 V325" />
    <path d="M492 352 L544 325 L600 360 L656 325 L708 352" />
  </g>
</svg>
